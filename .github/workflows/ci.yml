name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: clinica_dev
          POSTGRES_DB: clinica_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinica" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://clinica:clinica_dev@localhost:5432/clinica_test
      E2E_DATABASE_URL: postgres://clinica:clinica_dev@localhost:5432/clinica_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Testes de integração (API + banco)
        run: npm test
      - name: Build
        run: npm run build
      - name: Testes de ponta a ponta (celular e desktop)
        run: |
          PGPASSWORD=clinica_dev psql -h localhost -U clinica -d clinica_test -c "CREATE DATABASE clinica_e2e"
          npx playwright install --with-deps chromium
          npx playwright test
